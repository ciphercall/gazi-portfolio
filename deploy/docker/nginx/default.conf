# Gazi Portfolio — single origin.
#
#   /media/*   served straight off the shared volume by nginx (no Node hop)
#   /healthz   cheap liveness probe for the compose healthcheck
#   /*         proxied to the Next.js app (site, admin, API, PDF renderer)

upstream gazi_app {
  server app:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  client_body_timeout  60s;

  # ------------------------------------------------------------------ probe ---
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }

  # ------------------------------------------------------------------ media ---
  # Uploaded WebP images and generated CV PDFs. Immutable content-addressed
  # filenames, so a long cache is safe.
  location ^~ /media/ {
    alias /srv/media/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---------------------------------------------------------------- upstream ---
  location / {
    proxy_pass http://gazi_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Headless Chromium printing the CV is the slowest thing behind this
    # proxy; give it room rather than returning a 504 mid-render.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Security headers are also set by next.config.ts; repeated here so they
    # hold for every response path, including nginx-served media.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}

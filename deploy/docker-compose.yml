# ============================================================================
#  Gazi Portfolio — local Docker stack
#
#    postgres :16-alpine   private, published on 5436 for inspection
#    app      :Next.js     the site, the admin panel, the PDF renderer, the API
#    web      :nginx       single origin on ${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8023},
#                          serves /media off the volume. In on-demand mode the
#                          gatekeeper sets WEB_BIND=127.0.0.1 and WEB_PORT=INTERNAL_PORT.
#
#  Driven by  portfolio-deploy.ps1  at the workspace root.
# ============================================================================

name: gazi-portfolio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gazi_portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run -Action env}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-gazi_portfolio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: deploy/docker/app/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
    image: gazi-portfolio/app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required — run -Action env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — run -Action env}
      SITE_URL: ${SITE_URL:-http://localhost:8023}
      SITE_NAME: ${SITE_NAME:-Gazi Monir-Uz-Zaman}
      MEDIA_ROOT: ${MEDIA_ROOT:-/srv/media}
      GIT_SHA: ${GIT_SHA:-unknown}
      # Consumed once by `-Action seed` to create the admin login.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SOCIAL_TOKEN_KEY: ${SOCIAL_TOKEN_KEY:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    volumes:
      - portfolio-media:/srv/media
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8023}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Uploaded WebP media is served straight off the volume by nginx —
      # image bytes never travel through the Node process.
      - portfolio-media:/srv/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  portfolio-postgres-data:
    name: gazi-portfolio-postgres-data
  portfolio-media:
    name: gazi-portfolio-media
